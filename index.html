<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap" rel="stylesheet">
    <title>🍔 햄버거 가게 게임</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Press Start 2P', 'Courier New', monospace;
    background: #8B6242;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    position: relative;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
}

img {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
}

body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
        repeating-linear-gradient(
            0deg,
            #7A5535 0px,
            #7A5535 3px,
            #8B6242 3px,
            #8B6242 40px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 80px,
            rgba(74,44,18,0.15) 80px,
            rgba(74,44,18,0.15) 83px,
            transparent 83px,
            transparent 160px
        );
    background-size: 100% 40px, 160px 100%;
    background-color: #8B6242;
}

body::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
        radial-gradient(circle at 30% 25%, rgba(255,180,0,0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 75%, rgba(255,120,0,0.05) 0%, transparent 50%);
    pointer-events: none;
}

.restaurant-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    z-index: 0;
}

.menu-board {
    position: absolute;
    top: 20px;
    right: 30px;
    width: 160px;
    height: 220px;
    background: linear-gradient(135deg, #1a0f0a 0%, #2c1810 100%);
    border: 8px solid #CD853F;
    border-radius: 12px;
    box-shadow:
        0 15px 40px rgba(0,0,0,0.6),
        inset 0 2px 10px rgba(255,255,255,0.05);
}

.menu-board::before {
    content: 'MENU';
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: #FFD700;
    font-size: 2em;
    font-weight: 900;
    text-shadow:
        2px 2px 0 #FF8C00,
        4px 4px 10px rgba(255,215,0,0.5);
    letter-spacing: 4px;
}

.menu-board::after {
    content: '치즈버거\A베이컨 버거\A샐러드';
    white-space: pre;
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #FFA500;
    font-size: 1.1em;
    line-height: 1.5;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    font-weight: 700;
    text-align: center;
    width: 180px;
}

.lamp {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 70px;
    background: linear-gradient(180deg, #2c2c2c 0%, #3a3a3a 50%, #4a4a4a 100%);
    clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
    box-shadow:
        0 8px 40px rgba(255,215,0,0.4),
        inset 0 2px 5px rgba(255,255,255,0.1);
    border-radius: 5px;
    display: none;
}

.lamp::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 15px;
    height: 15px;
    background: #2c2c2c;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
}

.lamp::after {
    content: '';
    position: absolute;
    bottom: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 300px;
    background: radial-gradient(
        ellipse at center,
        rgba(255,235,150,0.3) 0%,
        rgba(255,215,0,0.15) 30%,
        transparent 70%
    );
    animation: lampGlow 3s ease-in-out infinite;
}

@keyframes lampGlow {
    0%, 100% {
        opacity: 1;
    }
    50% {
        opacity: 0.7;
    }
}

.shop-sign {
    display: none;
}

@keyframes signGlow {
    0%, 100% {
        box-shadow:
            0 10px 30px rgba(0,0,0,0.6),
            inset 0 3px 15px rgba(255,255,255,0.4),
            0 0 30px rgba(255,215,0,0.5);
    }
    50% {
        box-shadow:
            0 10px 30px rgba(0,0,0,0.6),
            inset 0 3px 15px rgba(255,255,255,0.4),
            0 0 50px rgba(255,215,0,0.8);
    }
}

.shop-sign::before {
    content: 'BURGER SHOP';
    color: white;
    font-size: 1.3em;
    font-weight: 900;
    text-shadow:
        3px 3px 0 #8B4513,
        -1px -1px 0 #8B4513,
        1px -1px 0 #8B4513,
        -1px 1px 0 #8B4513,
        5px 5px 15px rgba(0,0,0,0.7);
    letter-spacing: 2px;
}

.shop-sign::after {
    content: '⭐';
    position: absolute;
    top: -8px;
    right: -8px;
    font-size: 1.5em;
    color: #FFD700;
    text-shadow: 0 0 15px rgba(255,215,0,1);
    animation: starTwinkle 1.5s infinite;
}

@keyframes starTwinkle {
    0%, 100% {
        opacity: 1;
        transform: rotate(0deg) scale(1);
    }
    50% {
        opacity: 0.5;
        transform: rotate(180deg) scale(1.2);
    }
}

.clock {
    position: absolute;
    top: 100px;
    right: 280px;
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, #F5F5DC 0%, #E8E8D0 100%);
    border-radius: 50%;
    border: 6px solid #8B4513;
    box-shadow:
        0 8px 25px rgba(0,0,0,0.5),
        inset 0 2px 10px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
}

.clock::before {
    content: '12';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9em;
    font-weight: bold;
    color: #2c1810;
}

.clock::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 20px;
    background: #2c1810;
    transform-origin: bottom center;
    transform: translate(-1px, -20px) rotate(90deg);
    border-radius: 2px;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
}

.game-container {
    width: 100%;
    height: 100vh;
    position: relative;
}

.screen {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 0;
    left: 0;
}

.screen.hidden {
    display: none;
}

/* ===== 시작 화면: 크림 + 빈티지 다이너 ===== */
/* ===== 시작 화면: 크림 나무벽 + 빈티지 다이너 ===== */
.start-content {
    width: 100%;
    height: 100%;
    background: #E8D4BC;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 28px 20px;
    position: relative;
    overflow: hidden;
    border: none;
    box-shadow: none;
    border-radius: 0;
}

.start-content::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
        repeating-linear-gradient(
            0deg,
            #DCCAB2 0px,
            #DCCAB2 2px,
            #E8D4BC 2px,
            #E8D4BC 28px
        ),
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 60px,
            rgba(180,150,110,0.12) 60px,
            rgba(180,150,110,0.12) 62px,
            transparent 62px,
            transparent 120px
        );
    background-size: 100% 28px, 120px 100%;
    z-index: 0;
}

.start-content::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
        radial-gradient(circle at 30% 20%, rgba(255,200,100,0.1) 0%, transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(255,165,0,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
}

.start-inner {
    position: relative;
    z-index: 1;
    text-align: center;
    width: 90%;
    max-width: 380px;
}

.diner-sign {
    background: white;
    border: 4px solid #E07B30;
    border-radius: 8px;
    padding: 24px 20px;
    margin-bottom: 18px;
    position: relative;
    box-shadow:
        0 0 0 2px white,
        0 0 0 6px #E07B30,
        0 8px 30px rgba(0,0,0,0.12);
}

.diner-ribbon {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: #E07B30;
    color: white;
    font-size: 8px;
    font-weight: 900;
    padding: 4px 20px;
    letter-spacing: 3px;
    clip-path: polygon(5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%, 0% 50%);
}

.start-burger-icon {
    font-size: 50px;
    margin-bottom: 8px;
}

.game-logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 28px;
    color: #5D3A1A;
    margin-bottom: 2px;
    text-shadow: none;
    font-weight: 400;
}

.game-est {
    font-size: 7px;
    color: #E07B30;
    letter-spacing: 2px;
    font-weight: 700;
    margin: 0;
    white-space: nowrap;
}

.game-desc {
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    color: #5D3A1A;
    opacity: 0.6;
    margin-top: 6px;
    margin-bottom: 0;
}

.diner-checker {
    display: flex;
    gap: 0;
    margin: 14px 0;
    justify-content: center;
    height: 12px;
    background: repeating-linear-gradient(
        90deg,
        #E07B30 0px, #E07B30 12px,
        white 12px, white 24px
    );
    background-size: 24px 12px;
}

.nickname-input-container {
    margin-bottom: 12px;
}

.nickname-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid #E8C9A8;
    background: white;
    font-family: 'Jua', sans-serif;
    font-size: 12px;
    color: #333;
    outline: none;
    box-shadow: none;
}

.nickname-input:focus {
    border-color: #E07B30;
    box-shadow: 0 0 10px rgba(224,123,48,0.15);
}

.nickname-input::placeholder {
    color: #bbb;
}

.start-btn {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #E07B30;
    color: white;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    box-shadow: 0 4px 0 #A85A1E, 0 8px 20px rgba(224,123,48,0.25);
    margin-bottom: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.1s;
}

.start-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #A85A1E;
}

.hall-of-fame-btn {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    background: white;
    border: 2px solid #E8C9A8;
    color: #5D3A1A;
    font-family: 'Jua', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.1s;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.hall-of-fame-btn:active {
    transform: translateY(1px);
}

/* ============================================
   명예의 전당 — 레트로/아케이드 (크림 톤)
   ============================================ */
.hall-of-fame-content {
    background: linear-gradient(135deg, #FFFDF5 0%, #FFF8E7 50%, #FFF3D6 100%);
    padding: 24px 24px 12px 24px;
    border-radius: 18px;
    box-shadow:
        0 0 25px rgba(224, 123, 48, 0.25),
        0 15px 40px rgba(0, 0, 0, 0.2);
    border: 4px solid #D2691E;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
}

.hall-of-fame-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 2em;
    margin-bottom: 20px;
    color: #D2691E;
    text-shadow: 2px 2px 0px rgba(210, 105, 30, 0.2);
    font-weight: 900;
    letter-spacing: 3px;
}

.hall-of-fame-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
}

.hall-of-fame-item {
    background: rgba(255, 255, 255, 0.6);
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid #E8C9A8;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.2s;
}

.hall-of-fame-item:hover {
    background: rgba(255, 255, 255, 0.85);
    border-color: #D2691E;
}

.hall-of-fame-rank {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.8em;
    font-weight: 900;
    color: #D94040;
    min-width: 50px;
    text-align: center;
}

.hall-of-fame-rank.first {
    color: #FFB800;
    text-shadow: 1px 1px 0px #E09500;
}

.hall-of-fame-rank.second {
    color: #A0A0A0;
}

.hall-of-fame-rank.third {
    color: #CD7F32;
}

.hall-of-fame-info {
    flex: 1;
}

.hall-of-fame-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.2em;
    font-weight: 700;
    color: #5D3A1A;
    margin-bottom: 3px;
}

.hall-of-fame-stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 0.8em;
    color: #8B5A2B;
}

.hall-of-fame-stat {
    display: flex;
    align-items: center;
    gap: 4px;
}

.back-btn {
    display: block;
    width: calc(100% - 48px);
    padding: 14px 20px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1em;
    font-weight: 400;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #8B5A2B 0%, #D2691E 100%);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 0 #6B4423, 0 6px 15px rgba(139, 69, 19, 0.3);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    position: sticky;
    bottom: 0;
    margin: 0 auto;
    z-index: 20;
}

.back-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #6B4423;
}

#hallOfFameScreen {
    background:
        radial-gradient(ellipse at center, rgba(255, 248, 230, 0.8) 0%, rgba(255, 243, 214, 0.5) 60%, rgba(250, 240, 210, 0.3) 100%),
        linear-gradient(135deg, #FFFDF5 0%, #FFF5E1 100%);
}

.empty-hall-of-fame {
    text-align: center;
    padding: 40px;
    color: #999;
    font-size: 1.2em;
}

#gameScreen {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding: 0;
    gap: 0;
    position: relative;
    z-index: 1;
}

#gameScreen.hidden {
    display: none;
}

#gameScreen > *:not(.restaurant-bg) {
    position: relative;
    z-index: 2;
}

.top-ui {
    display: flex;
    justify-content: space-between;
    padding: 0 30px;
    gap: 20px;
}

.score-display,
.level-display,
.combo-display {
    background: #FFF5E8;
    border: 2px solid #E07B30;
    padding: 10px 25px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: flex;
    gap: 10px;
    align-items: center;
    border: 2px solid #E07B30;
}

.label {
    font-weight: 700;
    font-size: 1em;
    color: #5D3A1A;
}

.value {
    font-weight: 900;
    font-size: 1.1em;
    color: #E07B30;
}

.customer-area {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    flex: 1;
    min-height: 0;
    overflow: visible;
    position: relative;
    padding-top: 0px;
    gap: 10px;
    margin-top: -20px;
}

.customer-area::before {
    display: none;
}

.customer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: customerEnter 0.5s ease;
    position: relative;
    transform: scale(0.85);
    margin-bottom: -10px;
}

@keyframes customerEnter {
    0% {
        transform: scale(0.7);
        opacity: 0;
    }
    100% {
        transform: scale(0.85);
        opacity: 1;
    }
}

@keyframes customerLeave {
    0% {
        transform: scale(0.85);
        opacity: 1;
    }
    100% {
        transform: scale(1.3);
        opacity: 0;
    }
}

@keyframes customerLeaveHappy {
    0% {
        transform: scale(0.85);
        opacity: 1;
    }
    100% {
        transform: scale(1.3);
        opacity: 0;
    }
}

@keyframes speechBubbleFadeOut {
    0% {
        opacity: 1;
    }
    100% {
        opacity: 0;
    }
}

@keyframes speechBubbleFadeIn {
    0% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }
}

.praise-bubble {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    background: none;
    border: none;
    box-shadow: none;
    padding: 0;
    font-family: 'Jua', sans-serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 3px;
    color: #FF1493;
    text-shadow:
        -2px -2px 0 #fff, 2px -2px 0 #fff,
        -2px 2px 0 #fff, 2px 2px 0 #fff,
        0 0 12px rgba(255, 20, 147, 0.4);
    z-index: 101;
    white-space: nowrap;
    pointer-events: none;
    animation: praiseFloat 1.5s ease-out forwards;
}

.praise-bubble.warning {
    color: #FF4500;
    text-shadow:
        -2px -2px 0 #fff, 2px -2px 0 #fff,
        -2px 2px 0 #fff, 2px 2px 0 #fff,
        0 0 12px rgba(255, 69, 0, 0.4);
}

.praise-bubble::before,
.praise-bubble::after {
    content: none !important;
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    border: none !important;
}

.score-pop {
    animation: scorePop 0.4s ease;
}

@keyframes scorePop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); color: #FFD700; }
    100% { transform: scale(1); }
}

@keyframes praiseFloat {
    0% {
        opacity: 0;
        transform: translateX(-50%) translateY(10px) scale(0.3);
    }
    15% {
        opacity: 1;
        transform: translateX(-50%) translateY(-5px) scale(1.25);
    }
    30% {
        transform: translateX(-50%) translateY(-10px) scale(1);
    }
    75% {
        opacity: 1;
        transform: translateX(-50%) translateY(-20px) scale(1.05);
    }
    100% {
        opacity: 0;
        transform: translateX(-50%) translateY(-40px) scale(1.3);
    }
}

.tip-animation {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.5em;
    font-weight: 900;
    color: #FFD700;
    text-shadow:
        2px 2px 0 #E07B30,
        -2px -2px 0 #E07B30,
        2px -2px 0 #E07B30,
        -2px 2px 0 #E07B30,
        4px 4px 10px rgba(0,0,0,0.5);
    animation: tipFloatLeft 1s ease-out forwards;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
}

@keyframes tipFloat {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    50% {
        transform: translate(-50%, -80px) scale(1.2);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -120px) scale(1);
        opacity: 0;
    }
}

@keyframes tipFloatLeft {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }
    25% {
        transform: translate(-50%, -70px) scale(1.3);
        opacity: 1;
    }
    60% {
        transform: translate(-50%, -100px) scale(1.05);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -140px) scale(1.4);
        opacity: 0;
    }
}

.customer-image {
    width: 217px;
    height: 344px;
    object-fit: contain;
    filter: none;
    animation: none;
    transition: opacity 0.3s ease;
    margin-top: -10px;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
}


@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

.speech-bubble {
    background: #FFF5E8;
    padding: 10px 18px;
    border-radius: 20px;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.2));
    position: relative;
    min-width: auto;
    max-width: 550px;
    border: 2px solid #E07B30;
    margin: 15px auto 20px auto;
    width: fit-content;
}

.speech-bubble::before {
    content: '';
    position: absolute;
    top: -19px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-bottom: 20px solid #FFF5E8;
}

.speech-bubble::after {
    content: '';
    display: none;
}

.order-text {
    font-weight: 800;
    color: #E74C3C;
    margin-bottom: 3px;
    font-size: 0.9em;
    text-align: center;
    text-shadow: none;
}

.order-burger {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 40px;
    background: #E8E0D5;
    border-radius: 12px;
    padding: 3px 10px;
    box-shadow: none;
    border: none;
}

.order-layer {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.order-ingredient {
    font-size: 1.5em;
    margin: 0 3px;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));
}

.patience-bar {

    background: #ddd;

    overflow: hidden;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    border: 3px solid #ccc;
    margin-top: 8px;
}

.patience-fill {
    height: 100%;
    background: linear-gradient(90deg, #51cf66 0%, #37b24d 100%);
    transition: width 0.3s linear, background 0.3s ease;
    border-radius: 10px;
    width: 100%;
}

.patience-fill.warning {
    background: linear-gradient(90deg, #ffa500 0%, #ff8c00 100%);
}

.patience-fill.danger {
    background: linear-gradient(90deg, #ff6b6b 0%, #ff0000 100%);
    animation: shake 0.5s infinite;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
}

.work-area {
    display: flex;
    justify-content: center;
    flex-shrink: 0;
    min-height: auto;
    margin-bottom: 15px;
}

.game-controls {
    display: none;
}

.game-score {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 18px 20px;
    background: transparent;
    border: none;
    font-weight: 900;
    color: #FFF;
    font-size: 1.2em;
    text-shadow: 2px 2px 0 #000;
    text-transform: uppercase;
    letter-spacing: 2px;
}

.score-label {
    color: #FFF;
}

.score-value {
    color: #FFD700;
}

.game-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: linear-gradient(135deg, #A67C52 0%, #8B6F47 100%);
    border: 4px solid #000;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: all 0.1s ease;
    box-shadow: 0 5px 0 #000, inset 0 2px 6px rgba(255,255,255,0.2);
    font-weight: 900;
    color: #FFF;
    font-size: 0.65em;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    text-shadow: 2px 2px 0 #000;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    width: 100px;
    height: 210px;
    white-space: normal;
    text-align: center;
    line-height: 1.2;
}

.game-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #000, inset 0 2px 6px rgba(255,255,255,0.2);
}

.game-btn .btn-icon {
    font-size: 1.3em;
}

.undo-btn {
    background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
    box-shadow: 0 5px 0 #000, inset 0 2px 6px rgba(255,255,255,0.2);
}

.submit-btn {
    background: linear-gradient(135deg, #A67C52 0%, #8B6F47 100%);
    box-shadow: 0 5px 0 #000, inset 0 2px 6px rgba(255,255,255,0.2);
}

.counter {
    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 2px,
            rgba(74,44,18,0.08) 2px,
            rgba(74,44,18,0.08) 4px
        ),
        linear-gradient(180deg, #8B6F47 0%, #6D5635 100%);
    width: 450px;
    height: 120px;
    border-radius: 20px;
    box-shadow: 0 6px 0 #4A3A22;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    position: relative;
    border: 4px solid #5D4A2D;
}

.counter::before {
    content: '';
    position: absolute;
    top: 15px;
    left: 15px;
    right: 15px;
    height: 12px;
    background: linear-gradient(90deg,
        #CD853F 0%,
        #D2691E 20%,
        #CD853F 40%,
        #D2691E 60%,
        #CD853F 80%,
        #D2691E 100%
    );
    border-radius: 8px;
    box-shadow:
        0 3px 8px rgba(0,0,0,0.4),
        inset 0 2px 4px rgba(255,255,255,0.2);
    border: 2px solid #8B4513;
}

.counter::after {
    display: none;
}

.work-area::before {
    display: none;
}

.building-plate {
    background: radial-gradient(circle, #FFF8DC 0%, #E8D5B0 100%);
    border: 3px solid #B89A6A;
    width: 100%;
    height: auto;
    border-radius: 0;
    box-shadow: none;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 0px;
    border: none;
    position: relative;
}

.building-plate::before {
    content: '';
    display: none;
}

.burger-building {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    gap: 0;
    position: relative;
    width: 100%;
    height: 100%;
}

.building-ingredient {
    font-size: 2.5em;
    margin: -10px 0;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));
    position: relative;
}

.building-ingredient.new-ingredient {
    animation: ingredientDrop 0.4s ease;
}

@keyframes ingredientDrop {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

@keyframes ingredientShuffle {
    0%, 100% {
        transform: translateY(0);
        opacity: 1;
    }
    25% {
        transform: translateY(-15px) rotate(-5deg);
        opacity: 0.7;
    }
    50% {
        transform: translateY(-20px) rotate(5deg);
        opacity: 0.5;
    }
    75% {
        transform: translateY(-10px) rotate(-3deg);
        opacity: 0.7;
    }
}

.ingredients-area {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    gap: 10px;
    padding: 0 20px 15px 20px;
    margin-top: 0;
}

.ingredients-wrapper {
    display: flex;
    gap: 15px;
    align-items: center;
    justify-content: center;
}

.ingredients-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    background: transparent;
    padding: 0;
    border-radius: 0;
    box-shadow: none;
    border: none;
    max-width: 550px;
    width: 550px;
    flex-shrink: 0;
}

.ingredients-container.with-sides {
    grid-template-columns: repeat(6, 1fr);
    max-width: 650px;
    width: 650px;
}

.ingredient-slot {
    width: 100%;
    aspect-ratio: 1;
    background: rgba(255,245,232,0.4);
    border: 2px solid rgba(224,123,48,0.12);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: all 0.1s ease;
    position: relative;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 0 #000, inset 0 2px 6px rgba(255,255,255,0.2);
    gap: 5px;
}

.ingredient-slot[data-ingredient="bun"] {
    background: linear-gradient(135deg, #E8C89A 0%, #D4A574 100%);
}

.ingredient-slot[data-ingredient="patty"] {
    background: linear-gradient(135deg, #8B4513 0%, #6B3410 100%);
}

.ingredient-slot[data-ingredient="cheese"] {
    background: linear-gradient(135deg, #FFD93D 0%, #FFA500 100%);
}

.ingredient-slot[data-ingredient="lettuce"] {
    background: linear-gradient(135deg, #90EE90 0%, #32CD32 100%);
}

.ingredient-slot[data-ingredient="tomato"] {
    background: linear-gradient(135deg, #FF6B6B 0%, #EE5A52 100%);
}

.ingredient-slot[data-ingredient="onion"] {
    background: linear-gradient(135deg, #E4A0D4 0%, #D77FBC 100%);
}

.ingredient-slot[data-ingredient="pickle"] {
    background: linear-gradient(135deg, #7CB342 0%, #558B2F 100%);
}

.ingredient-slot[data-ingredient="bacon"] {
    background: linear-gradient(135deg, #CD7F32 0%, #A0522D 100%);
}

.ingredient-slot[data-ingredient="egg"] {
    background: linear-gradient(135deg, #FFE082 0%, #FFD54F 100%);
}

@media (hover: hover) {
    .start-btn:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 6px 0 #A85A1E, 0 12px 30px rgba(224,123,48,0.35);
    }

    .restart-btn:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 15px 40px rgba(81,207,102,0.6);
    }
}

.ingredient-slot:active {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

.ingredient-slot.selected {
    background: linear-gradient(135deg, #FF6347 0%, #FF4500 100%);
    border-color: #FFD700;
    transform: translateY(-2px);
    filter: brightness(1.1);
    border-width: 6px;
    transform: translateY(-8px) scale(1.1);
    box-shadow: 0 8px 0 #FFD700, 0 0 20px rgba(255,215,0,0.8), inset 0 3px 8px rgba(255,255,255,0.6);
    animation: selectedPulse 1s ease-in-out infinite;
}

@keyframes selectedPulse {
    0%, 100% {
        box-shadow: 0 8px 0 #FFD700, 0 0 20px rgba(255,215,0,0.8), inset 0 3px 8px rgba(255,255,255,0.6);
    }
    50% {
        box-shadow: 0 8px 0 #FFD700, 0 0 30px rgba(255,215,0,1), inset 0 3px 8px rgba(255,255,255,0.6);
    }
}

.ingredient-icon {
    font-size: 2.5em;
    filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
}

.ingredient-label {
    display: none;
}

.ingredient-slot.side-slot {
    background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
    border-color: #4CAF50;
}

.ingredient-slot.side-slot:hover {
    border-color: #2E7D32;
}

.ingredient-slot.side-slot.selected {
    background: linear-gradient(135deg, #A5D6A7 0%, #81C784 100%);
    border-color: #2E7D32;
}

.building-side {
    font-size: 2.5em !important;
}

.order-side {
    transform: scale(1.1);
}

.key-hints {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.hint {
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 8px 15px;
    border-radius: 10px;
    font-size: 0.9em;
    font-weight: 700;
}

.mobile-controls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    gap: 15px;
    z-index: 1000;
    background: rgba(0,0,0,0.7);
    padding: 15px 20px;
    border-radius: 25px;
    flex-shrink: 0;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.mobile-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #E07B30 0%, #FF9844 100%);
    border: none;
    border-radius: 15px;
    padding: 15px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 0 #A85A1E;
    min-width: 80px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.mobile-btn:active {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(255,99,71,0.6);
}

.mobile-btn .btn-icon {
    font-size: 1.5em;
    margin-bottom: 5px;
}

.mobile-btn .btn-label {
    font-size: 0.8em;
    font-weight: 700;
    color: white;
}

.undo-mobile-btn {
    background: linear-gradient(135deg, #868e96 0%, #495057 100%);
    box-shadow: 0 5px 15px rgba(73,80,87,0.4);
}

.add-mobile-btn {
    background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
    box-shadow: 0 5px 15px rgba(55,178,77,0.4);
}

.submit-mobile-btn {
    background: linear-gradient(135deg, #FF6347 0%, #DC143C 100%);
    box-shadow: 0 5px 15px rgba(220,20,60,0.4);
    transform: scale(1.15);
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        box-shadow: 0 5px 15px rgba(220,20,60,0.4);
    }
    50% {
        box-shadow: 0 5px 25px rgba(220,20,60,0.7);
    }
}

.submit-btn-fixed {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FF6347 0%, #DC143C 100%);
    border: none;
    border-radius: 20px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(220,20,60,0.5);
    min-width: 100px;
    min-height: 100px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    animation: pulse 2s ease-in-out infinite;
    flex-shrink: 0;
}

.submit-btn-fixed:active {
    transform: scale(0.95);
}

.submit-btn-fixed .btn-icon {
    font-size: 2.5em;
    margin-bottom: 5px;
}

.submit-btn-fixed .btn-label {
    font-size: 1em;
    font-weight: 700;
    color: white;
}

.clear-content {
    text-align: center;
    background: linear-gradient(135deg, #FFE4B5 0%, #FFD700 50%, #FFA500 100%);
    padding: 60px;
    border-radius: 30px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        0 0 50px rgba(255,215,0,0.6);
    border: 8px solid #FFD700;
    position: relative;
    animation: clearPulse 2s ease-in-out infinite;
}

@keyframes clearPulse {
    0%, 100% {
        box-shadow:
            0 20px 60px rgba(0,0,0,0.5),
            0 0 50px rgba(255,215,0,0.6);
    }
    50% {
        box-shadow:
            0 20px 60px rgba(0,0,0,0.5),
            0 0 80px rgba(255,215,0,1);
    }
}

.clear-content::before {
    content: '👑';
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 5em;
    animation: crownBounce 1s ease-in-out infinite;
}

@keyframes crownBounce {
    0%, 100% {
        transform: translateX(-50%) translateY(0) rotate(0deg);
    }
    50% {
        transform: translateX(-50%) translateY(-10px) rotate(10deg);
    }
}

.clear-title {
    font-size: 4em;
    font-weight: 900;
    background: linear-gradient(135deg, #FF6347 0%, #FFD700 50%, #FF6347 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    text-shadow: 2px 2px 10px rgba(255,215,0,0.5);
    animation: titleShine 2s linear infinite;
}

@keyframes titleShine {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 200% 50%;
    }
}

.clear-message {
    font-size: 1.5em;
    font-weight: 700;
    color: #8B4513;
    margin-bottom: 30px;
    text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
}

/* ============================================
   Game Over — 레트로/아케이드 (따뜻한 버거샵 톤)
   ============================================ */
.gameover-content {
    text-align: center;
    background: linear-gradient(135deg, #FFFDF5 0%, #FFF8E7 50%, #FFF3D6 100%);
    padding: 0;
    border-radius: 18px;
    box-shadow:
        0 0 25px rgba(224, 123, 48, 0.35),
        0 0 60px rgba(224, 123, 48, 0.12),
        0 15px 40px rgba(0, 0, 0, 0.25);
    border: 4px solid #D2691E;
    position: relative;
    overflow: hidden;
    max-width: 420px;
    width: 90%;
}

.gameover-content::before {
    display: none;
}

/* 스캔라인 오버레이 */
.arcade-scanlines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(139, 69, 19, 0.04) 2px,
        rgba(139, 69, 19, 0.04) 4px
    );
    pointer-events: none;
    z-index: 10;
}

/* 상단 도트 장식 */
.arcade-top-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 12px 0 8px;
    background: linear-gradient(180deg, rgba(210, 105, 30, 0.12) 0%, transparent 100%);
}

.arcade-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #E07B30;
    box-shadow: 0 0 6px #E07B30, 0 0 12px rgba(224, 123, 48, 0.5);
    animation: arcadeDotPulse 1.5s ease-in-out infinite;
}

.arcade-dot:nth-child(2) { animation-delay: 0.3s; background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b, 0 0 12px rgba(255, 107, 107, 0.5); }
.arcade-dot:nth-child(3) { animation-delay: 0.6s; background: #FFD700; box-shadow: 0 0 6px #FFD700, 0 0 12px rgba(255, 215, 0, 0.5); }

@keyframes arcadeDotPulse {
    0%, 100% { opacity: 0.5; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
}

/* GAME OVER 타이틀 — 네온 글로우 (따뜻한 톤) */
.gameover-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 3.2em;
    color: #D94040;
    margin: 16px 0 0 0;
    padding: 0 20px;
    font-weight: 900;
    text-shadow:
        0 0 10px rgba(217, 64, 64, 0.5),
        0 0 30px rgba(217, 64, 64, 0.3),
        2px 2px 0px #ff5252;
    letter-spacing: 6px;
    animation: neonFlicker 3s ease-in-out infinite;
}

@keyframes neonFlicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.75; }
    97% { opacity: 1; }
}

/* 구분선 */
.arcade-divider {
    height: 2px;
    margin: 14px 24px;
    background: linear-gradient(90deg, transparent, #D2691E, #E07B30, #D2691E, transparent);
    opacity: 0.5;
}

/* 스탯 영역 */
.final-stats {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin: 0 20px;
    padding: 0;
}

.stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: transparent;
    border-radius: 0;
    border-bottom: 1px solid rgba(210, 105, 30, 0.15);
}

.stat:last-child {
    border-bottom: none;
}

.stat-label {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.1em;
    color: #8B5A2B;
    font-weight: 400;
    margin-bottom: 0;
    letter-spacing: 2px;
}

.stat-value {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.8em;
    font-weight: 900;
    color: #D94040;
    text-shadow: 1px 1px 0px rgba(255, 82, 82, 0.3);
}

/* INSERT COIN 텍스트 */
.arcade-insert-coin {
    font-family: 'Jua', sans-serif;
    font-size: 0.7em;
    color: #C0772B;
    letter-spacing: 3px;
    margin: 4px 0 14px;
    animation: coinBlink 1s step-end infinite;
}

@keyframes coinBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

/* 버튼 영역 */
.restart-btn {
    display: block;
    width: calc(100% - 48px);
    margin: 0 auto 10px;
    padding: 14px 20px;
    font-family: 'Black Han Sans', sans-serif;
    font-size: 1.2em;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(135deg, #E07B30 0%, #D2691E 100%);
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 0 #A85A1E, 0 6px 20px rgba(224, 123, 48, 0.3);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

.restart-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #A85A1E;
}

/* Game Over 화면 내 명예의 전당 버튼 */
.gameover-content .hall-of-fame-btn {
    display: block;

function renderIngredients() {
    const container = document.getElementById('ingredientsContainer');
    container.innerHTML = '';

    // 사이드 유무에 따라 클래스 추가/제거
    if (gameState.totalBurgers >= 4) {
        container.classList.add('with-sides');
    } else {
        container.classList.remove('with-sides');
    }

    ingredients.forEach((ingredient, index) => {
        const slot = document.createElement('div');
        slot.className = 'ingredient-slot';
        slot.setAttribute('data-ingredient', ingredient.id);
        if (index === gameState.selectedIngredientIndex) {
            slot.classList.add('selected');
        }

        slot.innerHTML = `
            <div class="ingredient-icon">${ingredient.visual}</div>
            <div class="ingredient-label">${ingredient.name}</div>
        `;

        slot.onclick = () => selectIngredient(index);
        slot.ontouchend = (e) => {
            e.preventDefault();
            selectIngredient(index);
        };
        container.appendChild(slot);
    });

    if (gameState.totalBurgers >= 4) {
        sideItems.forEach((item, index) => {
            const slot = document.createElement('div');
            slot.className = 'ingredient-slot side-slot';
            const sideIndex = ingredients.length + index;
            if (sideIndex === gameState.selectedIngredientIndex) {
                slot.classList.add('selected');
            }

            slot.innerHTML = `
                <div class="ingredient-icon">${item.visual}</div>
                <div class="ingredient-label">${item.name}</div>
            `;

            slot.onclick = () => selectIngredient(sideIndex);
            slot.ontouchend = (e) => {
                e.preventDefault();
                selectIngredient(sideIndex);
            };
            container.appendChild(slot);
        });
    }
}

function randomizeCustomer() {
    // 새 손님이 왔을 때 랜덤으로 캐릭터 선택 (이전 캐릭터 제외)
    let availableCustomers = customers;

    // 이전 캐릭터가 있으면 제외
    if (previousCustomer && customers.length > 1) {
        availableCustomers = customers.filter(customer => customer !== previousCustomer);
    }

    // 랜덤 선택
    currentCustomer = availableCustomers[Math.floor(Math.random() * availableCustomers.length)];
    previousCustomer = currentCustomer; // 다음을 위해 저장

    if (customerImage) {
        customerImage.src = currentCustomer.waiting;

    }
}

function generateNewOrder() {
    // 재료 개수를 레벨에 따라 랜덤으로 생성
    let minIngredients, maxIngredients;
    if (gameState.level === 1) {
        minIngredients = 4;
        maxIngredients = 5;
    } else if (gameState.level === 2) {
        minIngredients = 5;
        maxIngredients = 6;
    } else if (gameState.level === 3) {
        minIngredients = 5;
        maxIngredients = 7;
    } else if (gameState.level <= 5) {
        minIngredients = 6;
        maxIngredients = 8;
    } else if (gameState.level <= 7) {
        minIngredients = 6;
        maxIngredients = 9;
    } else if (gameState.level <= 10) {
        minIngredients = 7;
        maxIngredients = 10;
    } else if (gameState.level <= 13) {
        minIngredients = 8;
        maxIngredients = 11;
    } else {
        minIngredients = 9;
        maxIngredients = 13;
    }

    // 랜덤 재료 개수 결정
    const numIngredients = Math.floor(Math.random() * (maxIngredients - minIngredients + 1)) + minIngredients;

    // 빵을 제외한 재료 풀
    const availableIngredients = ingredients.filter(ing => ing.id !== 'bun');

    // 랜덤하게 재료 선택
    gameState.currentOrder = ['bun']; // 아래 빵으로 시작

    for (let i = 0; i < numIngredients - 2; i++) {
        const randomIngredient = availableIngredients[Math.floor(Math.random() * availableIngredients.length)];
        gameState.currentOrder.push(randomIngredient.id);
    }

    gameState.currentOrder.push('bun'); // 위 빵으로 끝

    gameState.currentSides = [];
    if (gameState.totalBurgers >= 4) {
        if (Math.random() < 0.3) {
            const randomSide = sideItems[Math.floor(Math.random() * sideItems.length)];
            gameState.currentSides.push(randomSide.id);
        }
    }

    gameState.playerBurger = [];
    gameState.playerSides = [];
    // 사이드가 있으면 인내심 0.1초 더 추가
    if (gameState.currentSides.length > 0) {
        gameState.patienceValue = 100 + gameState.patienceDecreaseRate;
    } else {
        gameState.patienceValue = 100;
    }
    gameState.selectedIngredientIndex = 0;

    const customer = document.getElementById('customer');
    const speechBubble = document.querySelector('.speech-bubble');
    customer.style.animation = '';
    speechBubble.style.animation = '';
    speechBubble.style.opacity = '1';
    setTimeout(() => {
        customer.style.animation = 'customerEnter 0.5s ease';
    }, 10);

    renderOrder();
    renderPlayerBurger();

    // 새 주문 시작할 때는 애니메이션 없이 재료 표시
    const ingredientsContainer = document.getElementById('ingredientsContainer');
    ingredientsContainer.style.animation = 'none';
    renderIngredients();

    randomizeCustomer();
    startPatienceTimer();

    // 키 입력 다시 활성화 및 재촉 메시지 플래그 리셋
    gameState.isSubmitting = false;
    gameState.hasShownWarningMessage = false;
    gameState.hasShownUrgentMessage = false;
    // 2~3번에 한번씩 재촉 메시지 표시 (40% 확률)
    gameState.shouldShowRushMessages = Math.random() < 0.4;
}

function renderOrder() {
    const orderBurger = document.getElementById('orderBurger');
    orderBurger.innerHTML = '';

    const burgerContainer = document.createElement('div');
    burgerContainer.style.display = 'flex';
    burgerContainer.style.flexDirection = 'row';
    burgerContainer.style.alignItems = 'center';
    burgerContainer.style.gap = '5px';

    gameState.currentOrder.forEach(ingredientId => {
        const ingredient = ingredients.find(ing => ing.id === ingredientId);

        const ingredientEl = document.createElement('div');
        ingredientEl.className = 'order-ingredient';
        ingredientEl.textContent = ingredient.visual;

        burgerContainer.appendChild(ingredientEl);
    });

    gameState.currentSides.forEach(sideId => {
        const side = sideItems.find(s => s.id === sideId);

        const sideEl = document.createElement('div');
        sideEl.className = 'order-ingredient order-side';
        sideEl.textContent = side.visual;

        burgerContainer.appendChild(sideEl);
    });

    orderBurger.appendChild(burgerContainer);
}

    const burgerBuilding = document.getElementById('burgerBuilding');
    burgerBuilding.innerHTML = '';

    const mainContainer = document.createElement('div');

    mainContainer.style.flexDirection = 'row';
    mainContainer.style.alignItems = 'flex-end';
    mainContainer.style.justifyContent = 'center';
    mainContainer.style.gap = '15px';

    const burgerContainer = document.createElement('div');
    burgerContainer.style.display = 'flex';
    burgerContainer.style.flexDirection = 'row';
    burgerContainer.style.alignItems = 'center';
    burgerContainer.style.gap = '5px';

    gameState.playerBurger.forEach((ingredientId, index) => {
        const ingredient = ingredients.find(ing => ing.id === ingredientId);
        const ingredientEl = document.createElement('div');
        ingredientEl.className = 'building-ingredient';

        // 마지막 재료이고 새로 추가된 경우에만 애니메이션 적용
        if (isNewIngredient && index === gameState.playerBurger.length - 1) {
            ingredientEl.classList.add('new-ingredient');
        }

        ingredientEl.textContent = ingredient.visual;
        burgerContainer.appendChild(ingredientEl);
    });

    mainContainer.appendChild(burgerContainer);

    if (gameState.playerSides.length > 0) {
        const sideContainer = document.createElement('div');
        sideContainer.style.display = 'flex';
        sideContainer.style.flexDirection = 'column';
        sideContainer.style.alignItems = 'center';
        sideContainer.style.gap = '5px';

        gameState.playerSides.forEach(sideId => {
            const side = sideItems.find(s => s.id === sideId);
            const sideEl = document.createElement('div');
            sideEl.className = 'building-ingredient building-side';
            sideEl.textContent = side.visual;
            sideContainer.appendChild(sideEl);
        });

        mainContainer.appendChild(sideContainer);
    }

    burgerBuilding.appendChild(mainContainer);
}

function startPatienceTimer() {
    if (gameState.patienceTimer) {
        clearInterval(gameState.patienceTimer);
    }

    gameState.patienceTimer = setInterval(() => {
        gameState.patienceValue -= gameState.patienceDecreaseRate;

        if (gameState.patienceValue <= 0) {
            gameState.patienceValue = 0;
            clearInterval(gameState.patienceTimer);
            customerLeft();
        }

        updatePatienceBar();
    }, 110);
}

function updatePatienceBar() {
    const fill = document.getElementById('patienceFill');
    fill.style.width = gameState.patienceValue + '%';

    fill.classList.remove('warning', 'danger');
    if (gameState.patienceValue <= 40) {
        fill.classList.add('danger');
        updateCustomerFace('angry');

        // 40% 이하일 때 재촉 메시지 (이번 주문에서만 표시)
        if (gameState.shouldShowRushMessages && !gameState.hasShownUrgentMessage) {
            const urgentMessages = ['빨리 해주세요! ⏰', '시간이 없어요! 😤', '서두르세요! 💢'];
            const message = urgentMessages[Math.floor(Math.random() * urgentMessages.length)];
            showPraiseBubble(message, 1700);
            gameState.hasShownUrgentMessage = true;
        }
    } else if (gameState.patienceValue <= 70) {
        fill.classList.add('warning');
        updateCustomerFace('neutral');

        // 70% 이하일 때 재촉 메시지 (이번 주문에서만 표시)
        if (gameState.shouldShowRushMessages && !gameState.hasShownWarningMessage) {
            const warningMessages = ['조금만 서둘러주세요 🙏', '시간이 별로 없어요 ⏱️', '빨리 부탁해요 😅'];
            const message = warningMessages[Math.floor(Math.random() * warningMessages.length)];
            showPraiseBubble(message, 1700);
            gameState.hasShownWarningMessage = true;
        }
    } else {
        updateCustomerFace('neutral');
    }
}

function updateCustomerFace(mood) {
    const customerImage = document.getElementById('customerImage');

    if (!customerImage || !currentCustomer) {
        console.warn('⚠️ customerImage 또는 currentCustomer가 없음');
        return;
    }

    console.log('😊 손님 표정 변경:', mood);

    if (mood === 'happy') {
        // 성공! 햄버거 들고 있는 이미지로 변경
        currentCustomerState = 'success';
        console.log('🎉 성공 이미지로 변경:', currentCustomer.success);
        customerImage.src = currentCustomer.success;
    } else if (mood === 'angry') {
        // 오래 걸려서 짜증남 - 짜증나는 이미지
        currentCustomerState = 'impatient';
        console.log('😠 짜증 이미지로 변경:', currentCustomer.impatient);
        customerImage.src = currentCustomer.impatient;
    } else if (mood === 'neutral') {
        // 대기 - 기다리는 이미지
        currentCustomerState = 'waiting';
        console.log('😐 대기 이미지로 변경:', currentCustomer.waiting);
        customerImage.src = currentCustomer.waiting;
    }
}

function setupKeyboardControls() {
    document.addEventListener('keydown', handleKeyPress);
}

function handleKeyPress(e) {
    if (!gameState.isPlaying || gameState.isSubmitting) return;

    switch(e.key) {
        case 'ArrowLeft':
            e.preventDefault();
            moveSelection(-1);
            break;
        case 'ArrowRight':
            e.preventDefault();
            moveSelection(1);
            break;
        case 'ArrowUp':
            e.preventDefault();
            const colsUp = gameState.totalBurgers >= 4 ? 6 : 5;
            moveSelection(-colsUp);
            break;
        case 'ArrowDown':
            e.preventDefault();
            const colsDown = gameState.totalBurgers >= 4 ? 6 : 5;
            moveSelection(colsDown);
            break;
        case ' ':
            e.preventDefault();
            addSelectedIngredient();
            break;
        case 'Enter':
            e.preventDefault();
            submitBurger();
            break;
        case 'Backspace':
            e.preventDefault();
            undoIngredient();
            break;
    }
}

function moveSelection(direction) {
    gameState.selectedIngredientIndex += direction;

    const totalItems = gameState.totalBurgers >= 4
        ? ingredients.length + sideItems.length
        : ingredients.length;

    if (gameState.selectedIngredientIndex < 0) {
        gameState.selectedIngredientIndex = totalItems - 1;
    } else if (gameState.selectedIngredientIndex >= totalItems) {
        gameState.selectedIngredientIndex = 0;
    }

    renderIngredients();
}

function addSelectedIngredient() {
    if (gameState.selectedIngredientIndex < ingredients.length) {
        const selectedIngredient = ingredients[gameState.selectedIngredientIndex];
        gameState.playerBurger.push(selectedIngredient.id);
        console.log('햄버거 재료 추가:', selectedIngredient.id);
    } else {
        const sideIndex = gameState.selectedIngredientIndex - ingredients.length;
        const selectedSide = sideItems[sideIndex];
        gameState.playerSides.push(selectedSide.id);
        console.log('사이드 재료 추가:', selectedSide.id);
    }

    renderPlayerBurger(true);

    const slot = document.querySelectorAll('.ingredient-slot')[gameState.selectedIngredientIndex];
    if (slot) {
        slot.style.transform = 'scale(1.2)';
        setTimeout(() => {
            slot.style.transform = '';
        }, 200);
    }
}

function undoIngredient() {
    if (gameState.playerSides.length > 0) {
        gameState.playerSides.pop();
    } else if (gameState.playerBurger.length > 0) {
        gameState.playerBurger.pop();
    }
    renderPlayerBurger();
}

function submitBurger() {
    if (gameState.playerBurger.length === 0 || gameState.isSubmitting) {
        return;
    }

    gameState.isSubmitting = true;

    console.log('\n========== 제출 ==========');
    console.log('📋 주문:');
    console.log('  햄버거:', gameState.currentOrder.map(id => {
        const ing = ingredients.find(i => i.id === id);
        return ing ? `${ing.name}(${id})` : id;
    }));
    if (gameState.currentSides.length > 0) {
        console.log('  사이드:', gameState.currentSides.map(id => {
            const side = sideItems.find(s => s.id === id);
            return side ? `${side.name}(${id})` : id;
        }));
    }
    console.log('\n👨‍🍳 제작:');
    console.log('  햄버거:', gameState.playerBurger.map(id => {
        const ing = ingredients.find(i => i.id === id);
        return ing ? `${ing.name}(${id})` : id;
    }));
    if (gameState.playerSides.length > 0) {
        console.log('  사이드:', gameState.playerSides.map(id => {
            const side = sideItems.find(s => s.id === id);
            return side ? `${side.name}(${id})` : id;
        }));
    }
    console.log('==========================\n');

    clearInterval(gameState.patienceTimer);

    const result = checkBurgerAccuracy();

    if (result.perfect) {
        handlePerfectBurger();
    } else if (result.correct) {
        handleCorrectBurger(result);
    } else {
        handleWrongBurger();
    }

    if (result.perfect || result.correct) {
        // 분홍색 말풍선이 사라진 후 (850ms) +원과 함께 캐릭터 커지기 시작
        setTimeout(() => {
            if (gameState.isPlaying) {
                const customer = document.getElementById('customer');
                const speechBubble = document.querySelector('.speech-bubble');
                if (speechBubble) speechBubble.style.opacity = '0';
                customer.style.animation = 'customerLeaveHappy 0.85s ease-out';

                // +원이 사라지는 시간과 캐릭터 사라지는 시간 후에 새 주문 생성
                setTimeout(() => {
                    gameState.totalBurgers++;
                    checkLevelUp();

                    if (gameState.totalBurgers % 3 === 0) {
                        shuffleIngredients();
                    }

                    customer.style.animation = '';
                    generateNewOrder();
                }, 850);
            }
        }, 850);
    }
}

function checkBurgerAccuracy() {
    console.log('=== 햄버거 체크 ===');
    console.log('주문 햄버거:', gameState.currentOrder);
    console.log('제작 햄버거:', gameState.playerBurger);

    if (gameState.playerBurger.length !== gameState.currentOrder.length) {
        console.log('햄버거 개수 불일치');
        return { perfect: false, correct: false, accuracy: 0 };
    }

    let correctCount = 0;
    for (let i = 0; i < gameState.currentOrder.length; i++) {
        if (gameState.playerBurger[i] === gameState.currentOrder[i]) {
            correctCount++;
        } else {
            console.log(`재료 ${i} 불일치: ${gameState.playerBurger[i]} !== ${gameState.currentOrder[i]}`);
        }
    }

    const burgerAccuracy = correctCount / gameState.currentOrder.length;
    console.log('햄버거 정확도:', burgerAccuracy);

    console.log('=== 사이드 체크 ===');
    console.log('주문 사이드:', gameState.currentSides);
    console.log('제작 사이드:', gameState.playerSides);

    let sidesCorrect = true;
    if (gameState.currentSides.length !== gameState.playerSides.length) {
        console.log('사이드 개수 불일치');
        sidesCorrect = false;
    } else {
        // 순서 무관하게 포함 여부만 체크
        const sortedOrderSides = [...gameState.currentSides].sort();
        const sortedPlayerSides = [...gameState.playerSides].sort();
        for (let i = 0; i < sortedOrderSides.length; i++) {
            if (sortedOrderSides[i] !== sortedPlayerSides[i]) {
                console.log(`사이드 불일치: ${sortedPlayerSides[i]} !== ${sortedOrderSides[i]}`);
                sidesCorrect = false;
                break;
            }
        }
    }

    console.log('사이드 정확:', sidesCorrect);

    // 100% 정확해야만 정답으로 인정
    const isPerfect = burgerAccuracy === 1 && sidesCorrect;
    const isCorrect = burgerAccuracy === 1 && sidesCorrect;

    console.log('결과 - Perfect:', isPerfect, 'Correct:', isCorrect);

    return {
        perfect: isPerfect,
        correct: isCorrect,
        accuracy: burgerAccuracy,
        hasSide: gameState.currentSides.length > 0
    };
}

function handlePerfectBurger() {
    gameState.combo++;

    if (gameState.combo > gameState.maxCombo) {
        gameState.maxCombo = gameState.combo;
    }

    let tip;
    if (gameState.currentSides.length > 0) {
        tip = Math.floor(Math.random() * 11) + 10;
    } else {
        tip = Math.floor(Math.random() * 6) + 5;
    }
    gameState.score += tip;

    updateCustomerFace('happy');

    // 아직 사용하지 않은 칭찬 메시지 선택
    let availableMessages = praiseMessages.filter(msg => !gameState.usedPraiseMessages.includes(msg));

    // 모든 메시지를 다 사용했으면 리셋
    if (availableMessages.length === 0) {
        gameState.usedPraiseMessages = [];
        availableMessages = [...praiseMessages];
    }

    const praise = availableMessages[Math.floor(Math.random() * availableMessages.length)];
    gameState.usedPraiseMessages.push(praise);

    showPraiseBubble(praise);

    setTimeout(() => {
        showTipAnimation(tip);
    }, 850);

    updateUI();
}

function handleCorrectBurger(result) {
    let baseTip;
    if (result.hasSide) {
        baseTip = Math.floor(Math.random() * 11) + 10;
    } else {
        baseTip = Math.floor(Math.random() * 6) + 5;
    }
    const tip = Math.max(result.hasSide ? 10 : 5, Math.floor(baseTip * result.accuracy));
    gameState.score += tip;

    updateCustomerFace('happy');

    const goodMessages = ['괜찮아요 👌', '좋아요! 😊', '감사해요 🙂'];
    const praise = goodMessages[Math.floor(Math.random() * goodMessages.length)];

    showPraiseBubble(praise);

    setTimeout(() => {
        showTipAnimation(tip);
    }, 850);

    updateUI();
}

function handleWrongBurger() {
    gameState.combo = 0;
    gameState.mistakes++;

    if (gameState.mistakes >= 2) {
        updateCustomerFace('angry');

        const customer = document.getElementById('customer');
        customer.style.animation = 'customerLeave 1s ease-out forwards';

        setTimeout(() => {
            gameOver();
        }, 1000);
    } else {
        updateCustomerFace('angry');

        const warningMessages = ['조심하세요! ⚠️', '한 번만 더 틀리면...😰', '다시 해주세요! 🙏'];
        const warning = warningMessages[Math.floor(Math.random() * warningMessages.length)];
        showPraiseBubble(warning, 1400);

        // 말풍선이 사라진 후 0.2초 뒤에 캐릭터가 사라지도록 0.6초 시점에 캐릭터 애니메이션 시작
        setTimeout(() => {
            if (gameState.isPlaying) {
                const customer = document.getElementById('customer');
                customer.style.animation = 'customerLeaveHappy 1s ease-out';

                setTimeout(() => {
                    customer.style.animation = '';
                    shuffleIngredients();
                    generateNewOrder();
                }, 1000);
            }
        }, 600);
    }
}

function showPraiseBubble(message, duration = 1500) {
    const customerArea = document.querySelector('.customer-area');

    // 기존 말풍선이 있으면 먼저 제거
    const existingBubbles = customerArea.querySelectorAll('.praise-bubble');
    existingBubbles.forEach(bubble => bubble.remove());

    const bubbleEl = document.createElement('div');
    bubbleEl.className = 'praise-bubble';
    bubbleEl.textContent = message;

    customerArea.appendChild(bubbleEl);

    setTimeout(() => {
        bubbleEl.remove();
    }, duration);
}

function showTipAnimation(tip) {
    const customerArea = document.querySelector('.customer-area');
    const tipEl = document.createElement('div');
    tipEl.className = 'tip-animation';
    tipEl.textContent = '💰 +' + tip + '원';

    customerArea.appendChild(tipEl);

    setTimeout(() => {
        tipEl.remove();
    }, 1000);
}

function customerLeft() {
    gameState.combo = 0;
    gameState.mistakes++;

    if (gameState.mistakes >= 2) {
        updateCustomerFace('angry');

        // 말풍선 먼저 사라지게
        const speechBubble = document.querySelector('.speech-bubble');
        speechBubble.style.animation = 'speechBubbleFadeOut 0.4s ease-out forwards';

        setTimeout(() => {
            const customer = document.getElementById('customer');
            customer.style.animation = 'customerLeave 1s ease-out forwards';

            setTimeout(() => {
                gameOver();
            }, 1000);
        }, 400);
    } else {
        updateCustomerFace('angry');

        // 2~3번에 한번씩만 재촉 메시지 표시 (40% 확률)
        if (Math.random() < 0.4) {
            const warningMessages = ['빨리 해주세요! ⏰', '시간이 없어요! 😤', '서두르세요! 💢'];
            const warning = warningMessages[Math.floor(Math.random() * warningMessages.length)];
            showPraiseBubble(warning, 1700);
        }

        setTimeout(() => {
            if (gameState.isPlaying) {
                // 말풍선 먼저 사라지게
                const speechBubble = document.querySelector('.speech-bubble');
                speechBubble.style.animation = 'speechBubbleFadeOut 0.4s ease-out forwards';

                setTimeout(() => {
                    const customer = document.getElementById('customer');
                    customer.style.animation = 'customerLeave 0.6s ease-out';

                    setTimeout(() => {
                        customer.style.animation = '';
                        speechBubble.style.animation = '';
                        shuffleIngredients();
                        generateNewOrder();
                    }, 600);
                }, 400);
            }
        }, 3000);
    }
}

function checkLevelUp() {
    const burgersNeeded = gameState.level * 2;

    if (gameState.totalBurgers >= burgersNeeded) {
        gameState.level++;

        if (gameState.level <= 3) {
            // 레벨 1-3는 속도 유지 (증가 없음)
        } else if (gameState.level <= 6) {
            gameState.patienceDecreaseRate += 0.2;
        } else if (gameState.level <= 10) {
            gameState.patienceDecreaseRate += 0.25;
        } else {
            gameState.patienceDecreaseRate += 0.3;
        }
    }
}

function updateUI() {
    const scoreEl = document.getElementById('scoreValue');
    scoreEl.textContent = gameState.score + '원';
    scoreEl.classList.remove('score-pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('score-pop');
    document.getElementById('levelValue').textContent = gameState.level;
    document.getElementById('comboValue').textContent = gameState.combo;
    const bottomScoreEl = document.getElementById('bottomScore');
    if (bottomScoreEl) {
        bottomScoreEl.textContent = gameState.score;
    }

    if (gameState.score >= 100) {
        gameState.isPlaying = false;
        clearInterval(gameState.patienceTimer);
        document.removeEventListener('keydown', handleKeyPress);
        setTimeout(() => {
            showGameClear();
        }, 1000);
    }
}

function gameOver() {
    gameState.isPlaying = false;
    clearInterval(gameState.patienceTimer);
    document.removeEventListener('keydown', handleKeyPress);

    saveToHallOfFame();

    showScreen('gameOverScreen');

    document.getElementById('finalScore').textContent = gameState.score + '원';
    document.getElementById('finalLevel').textContent = gameState.level;
    document.getElementById('totalBurgers').textContent = gameState.totalBurgers;
    document.getElementById('maxCombo').textContent = gameState.maxCombo;
}

function showGameClear() {
    saveToHallOfFame();

    showScreen('gameClearScreen');

    document.getElementById('clearScore').textContent = gameState.score + '원';
    document.getElementById('clearLevel').textContent = gameState.level;
    document.getElementById('clearBurgers').textContent = gameState.totalBurgers;
    document.getElementById('clearMaxCombo').textContent = gameState.maxCombo;
}

function restartGame() {
    showScreen('startScreen');
}

function saveToHallOfFame() {
    if (!gameState.nickname) {
        console.warn('⚠️ 닉네임이 없어서 명예의 전당에 저장하지 않습니다.');
        return;
    }

    const record = {
        nickname: gameState.nickname,
        score: gameState.score,
        level: gameState.level,
        totalBurgers: gameState.totalBurgers,
        maxCombo: gameState.maxCombo,
        timestamp: Date.now(),
        date: new Date().toISOString()
    };

    console.log('💾 Firebase에 기록 저장:', record);

    // Firebase에 저장
    try {
        const hallOfFameRef = window.firebaseRef(window.firebaseDB, 'hallOfFame');
        window.firebasePush(hallOfFameRef, record);
        console.log('✅ Firebase 저장 완료!');
    } catch (error) {
        console.error('❌ Firebase 저장 실패:', error);
        // Fallback: localStorage에 저장
        let hallOfFame = JSON.parse(localStorage.getItem('burgerGameHallOfFame') || '[]');
        hallOfFame.push(record);
        hallOfFame.sort((a, b) => b.score - a.score);
        hallOfFame = hallOfFame.slice(0, 50);
        localStorage.setItem('burgerGameHallOfFame', JSON.stringify(hallOfFame));
        console.log('⚠️ localStorage에 저장됨 (Fallback)');
    }
}

function showHallOfFame() {
    showScreen('hallOfFameScreen');
    renderHallOfFame();
}

function renderHallOfFame() {
    const hallOfFameList = document.getElementById('hallOfFameList');
    hallOfFameList.innerHTML = '<div class="empty-hall-of-fame">로딩 중... ⏳</div>';

    // Firebase에서 데이터 불러오기
    try {
        const hallOfFameRef = window.firebaseRef(window.firebaseDB, 'hallOfFame');
        const topScoresQuery = window.firebaseQuery(
            hallOfFameRef,
            window.firebaseOrderByChild('score'),
            window.firebaseLimitToLast(100)
        );

        window.firebaseOnValue(topScoresQuery, (snapshot) => {
            const hallOfFame = [];
            snapshot.forEach((childSnapshot) => {
                hallOfFame.push(childSnapshot.val());
            });

            // 점수 내림차순 정렬
            hallOfFame.sort((a, b) => b.score - a.score);

            // 상위 50개만
            const top50 = hallOfFame.slice(0, 50);

            if (top50.length === 0) {
                hallOfFameList.innerHTML = '<div class="empty-hall-of-fame">아직 기록이 없습니다.<br>첫 번째 알바생이 되어보세요! 🍔</div>';
                return;
            }

            hallOfFameList.innerHTML = top50.map((record, index) => {
                const rank = index + 1;
                let rankClass = '';
                let rankEmoji = '';

                if (rank === 1) {
                    rankClass = 'first';
                    rankEmoji = '🥇';
                } else if (rank === 2) {
                    rankClass = 'second';
                    rankEmoji = '🥈';
                } else if (rank === 3) {
                    rankClass = 'third';
                    rankEmoji = '🥉';
                } else {
                    rankEmoji = `#${rank}`;
                }

                const date = new Date(record.date);
                const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;

                return `
                    <div class="hall-of-fame-item">
                        <div class="hall-of-fame-rank ${rankClass}">${rankEmoji}</div>
                        <div class="hall-of-fame-info">
                            <div class="hall-of-fame-name">${record.nickname}</div>
                            <div class="hall-of-fame-stats">
                                <div class="hall-of-fame-stat">💰 ${record.score}원</div>
                                <div class="hall-of-fame-stat">📊 Lv.${record.level}</div>
                                <div class="hall-of-fame-stat">🍔 ${record.totalBurgers}개</div>
                                <div class="hall-of-fame-stat">🔥 ${record.maxCombo} 콤보</div>
                                <div class="hall-of-fame-stat">📅 ${dateStr}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            console.log('🏆 명예의 전당 로드 완료:', top50.length, '개 기록');
        }, {
            onlyOnce: true
        });
    } catch (error) {
        console.error('❌ Firebase 로드 실패:', error);
        // Fallback: localStorage에서 불러오기
        const hallOfFame = JSON.parse(localStorage.getItem('burgerGameHallOfFame') || '[]');

        if (hallOfFame.length === 0) {
            hallOfFameList.innerHTML = '<div class="empty-hall-of-fame">아직 기록이 없습니다.<br>첫 번째 알바생이 되어보세요! 🍔</div>';
            return;
        }

        hallOfFameList.innerHTML = hallOfFame.map((record, index) => {
            const rank = index + 1;
            let rankClass = '';
            let rankEmoji = '';

            if (rank === 1) {
                rankClass = 'first';
                rankEmoji = '🥇';
            } else if (rank === 2) {
                rankClass = 'second';
                rankEmoji = '🥈';
            } else if (rank === 3) {
                rankClass = 'third';
                rankEmoji = '🥉';
            } else {
                rankEmoji = `#${rank}`;
            }

            const date = new Date(record.date);
            const dateStr = `${date.getMonth() + 1}/${date.getDate()}`;

            return `
                <div class="hall-of-fame-item">
                    <div class="hall-of-fame-rank ${rankClass}">${rankEmoji}</div>
                    <div class="hall-of-fame-info">
                        <div class="hall-of-fame-name">${record.nickname}</div>
                        <div class="hall-of-fame-stats">
                            <div class="hall-of-fame-stat">💰 ${record.score}원</div>
                            <div class="hall-of-fame-stat">📊 Lv.${record.level}</div>
                            <div class="hall-of-fame-stat">🍔 ${record.totalBurgers}개</div>
                            <div class="hall-of-fame-stat">🔥 ${record.maxCombo} 콤보</div>
                            <div class="hall-of-fame-stat">📅 ${dateStr}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        console.log('⚠️ localStorage에서 로드됨 (Fallback)');
    }
}

function backToStart() {
    showScreen('startScreen');
}

console.log('🍔 햄버거 가게 게임 준비 완료!');
console.log('🔥 Firebase 글로벌 명예의 전당 사용 중!');
    </script>
</body>
